<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hours | AJ McMurphy's Irish Pub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body {
margin: 0;
font-family: 'Outfit', sans-serif;
background: #f5f5f5;
color: #111;
}
/* HEADER */
.header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 18px 30px;
background: #ffffff;
border-bottom: 1px solid rgba(0,0,0,0.06);
position: sticky;
top: 0;
z-index: 100;
transition: all 0.35s ease;
}
.header.scrolled {
padding: 10px 25px;
box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}
.logo {
height: 120px;
width: auto;
transition: 0.3s;
}
.header.scrolled .logo {
height: 70px;
}
.header-right {
display: flex;
align-items: center;
gap: 12px;
}
/* SOCIALS */
.socials a {
color: #444;
margin: 0 4px;
font-size: 16px;
transition: 0.2s;
}
.socials a:hover {
color: #2e7d32;
transform: translateY(-2px);
}
/* CTA BUTTON */
.cta {
background: linear-gradient(135deg, #2e7d32, #1b5e20);
color: white;
padding: 10px 16px;
border-radius: 999px;
text-decoration: none;
font-size: 14px;
white-space: nowrap;
transition: all 0.2s ease;
}
.cta:hover {
transform: translateY(-2px);
box-shadow: 0 6px 15px rgba(46, 125, 50, 0.3);
}

/* SIDEMENU */
.sidemenu {
position: fixed;
top: 0;
left: 0;
width: 260px;
height: 100%;
background: #111;
color: white;
padding: 30px 20px;
transform: translateX(-100%);
transition: 0.3s;
z-index: 1001;
font-family: 'Outfit', sans-serif;
}
.sidemenu a {
display: block;
color: white;
text-decoration: none;
font-size: 1.1rem;
padding: 14px 10px;
margin: 4px 0;
border-radius: 8px;
transition: all 0.2s ease;
}
.sidemenu a:hover {
background: rgba(255,255,255,0.1);
padding-left: 20px;
color: #90ee90;
}
.sidemenu.open { transform: translateX(0); }

.overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
opacity: 0;
pointer-events: none;
transition: 0.3s;
z-index: 1000;
}
.overlay.show {
opacity: 1;
pointer-events: all;
}

/* MENU BUTTON */
.menu-btn {
font-size: 24px;
cursor: pointer;
}

/* HERO */
.hero {
min-height: 40vh;
background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), url('bar.jpg');
background-size: cover;
background-position: center;
display: flex;
align-items: center;
justify-content: center;
color: white;
text-align: center;
}
.hero h1 {
font-size: clamp(2.2rem, 6vw, 3rem);
margin: 0;
}

/* HOURS CONTENT */
.hours-container {
max-width: 700px;
margin: 40px auto;
padding: 0 20px;
}
.hours-card {
background: white;
border-radius: 16px;
box-shadow: 0 10px 30px rgba(0,0,0,0.08);
padding: 40px 30px;
text-align: center;
}
.hours-card h2 {
color: #2e7d32;
margin-bottom: 30px;
font-size: 1.8rem;
}
.hours-list {
display: flex;
flex-direction: column;
gap: 18px;
max-width: 360px;
margin: 0 auto;
}
.day {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 1.15rem;
padding: 8px 0;
border-bottom: 1px solid #eee;
}
.day:last-child {
border-bottom: none;
}
.day-name {
font-weight: 500;
}
.closed {
color: #d32f2f;
font-weight: 500;
}

/* FOOTER */
footer {
text-align: center;
padding: 25px;
background: #111;
color: white;
}

/* MOBILE */
@media (max-width: 768px) {
.header {
padding: 12px 15px;
}
.logo {
height: 85px;
}
.header.scrolled .logo {
height: 65px;
}
.cta {
font-size: 13px;
padding: 8px 14px;
}
.menu-btn {
font-size: 22px;
}
.hero {
min-height: 35vh;
}
.hours-card {
padding: 30px 20px;
}
}
</style>
</head>
<body>

<!-- SIDEMENU -->
<div class="sidemenu" id="menu">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="hours.html">Hours</a>
<!--<a href="#">Events</a> -->
<a href="contact.html">Contact</a>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- HEADER -->
<div class="header">
<img src="logo.jpg" class="logo">
<div class="header-right">
<div class="socials">
<a href="https://www.facebook.com/ajmcmurphys/" target="_blank"><i class="fab fa-facebook-f"></i></a>
<a href="#"><i class="fab fa-x-twitter"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-tiktok"></i></a>
</div>
<a href="index.html" class="cta">Home</a>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>
</div>

<!-- HERO -->
<div class="hero">
<h1>Hours</h1>
</div>

<!-- MAIN CONTENT -->
<div class="hours-container">
<div class="hours-card">
<h2>Our Hours</h2>
<div class="hours-list">
<div class="day"><span class="day-name">Thursday</span> <span>4:00 PM – 12:00 AM</span></div>
<div class="day"><span class="day-name">Friday</span> <span>4:00 PM – 1:00 AM</span></div>
<div class="day"><span class="day-name">Saturday</span> <span>4:00 PM – 1:00 AM</span></div>
<div class="day"><span class="day-name">Sunday</span> <span class="closed">Closed</span></div>
<div class="day"><span class="day-name">Monday</span> <span class="closed">Closed</span></div>
<div class="day"><span class="day-name">Tuesday</span> <span>4:00 PM – 10:00 PM</span></div>
<div class="day"><span class="day-name">Wednesday</span> <span>4:00 PM – 10:00 PM</span></div>
</div>
</div>
</div>

<footer>
© 2026 AJ McMurphy's Irish Pub
</footer>

<script>
function toggleMenu() {
document.getElementById("menu").classList.toggle("open");
document.getElementById("overlay").classList.toggle("show");
}
window.addEventListener("scroll", function() {
const header = document.querySelector(".header");
if (window.scrollY > 50) {
header.classList.add("scrolled");
} else {
header.classList.remove("scrolled");
}
});
</script>
</body>
</html>
