<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ McMurphy's Irish Pub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scroll-padding-top: 80px;   /* Accounts for header height */
}

body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: #f5f5f5;
    color: #111;
}

/* HEADER - Original behavior */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    background: #ffffff;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: fixed;           /* Changed to fixed for better snapping */
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    transition: all 0.35s ease;
}
.header.scrolled {
    padding: 10px 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}
.logo {
    height: 120px;
    width: auto;
    transition: 0.3s;
}
.header.scrolled .logo {
    height: 70px;
}
.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}
.socials a {
    color: #444;
    margin: 0 4px;
    font-size: 16px;
    transition: 0.2s;
}
.socials a:hover {
    color: #2e7d32;
    transform: translateY(-2px);
}
.cta {
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    padding: 10px 16px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
    transition: all 0.2s ease;
}
.cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(46, 125, 50, 0.3);
}

/* SIDEMENU */
.sidemenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100%;
    background: #111;
    color: white;
    padding: 30px 20px;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1001;
    font-family: 'Outfit', sans-serif;
}
.sidemenu a {
    display: block;
    color: white;
    text-decoration: none;
    font-size: 1.1rem;
    padding: 14px 10px;
    margin: 4px 0;
    border-radius: 8px;
    transition: all 0.2s ease;
}
.sidemenu a:hover {
    background: rgba(255,255,255,0.1);
    padding-left: 20px;
    color: #90ee90;
}
.sidemenu.open { transform: translateX(0); }

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 1000;
}
.overlay.show {
    opacity: 1;
    pointer-events: all;
}

/* FULL SCREEN SECTIONS */
.event-section {
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    position: relative;
    scroll-snap-align: start;
    scroll-snap-stop: always;
}
.event-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.65));
}

/* Content */
.event-content {
    position: relative;
    z-index: 2;
    max-width: 90%;
}
.hero h1, .event-section h2 {
    font-size: clamp(2.2rem, 7vw, 3.8rem);
    margin: 0 0 12px 0;
    line-height: 1.1;
    font-weight: 700;
}
.subheading, .event-section p {
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    font-weight: 500;
    letter-spacing: 3px;
    margin: 0;
    opacity: 0.95;
}

/* Latest Updates */
.latest-updates {
    max-width: 1000px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    padding: 40px;
    text-align: center;
}
.fb-card {
    max-width: 500px;
    margin: 20px auto;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px;
    background: #111;
    color: white;
    scroll-snap-align: start;
}

/* MOBILE */
@media (max-width: 768px) {
    .event-section {
        background-attachment: scroll;
    }
}
</style>
</head>
<body>

<div class="sidemenu" id="menu">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="hours.html">Hours</a>
<a href="contact.html">Contact</a>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="header">
<img src="logo.jpg" class="logo">
<div class="header-right">
<div class="socials">
<a href="https://www.facebook.com/ajmcmurphys/" target="_blank"><i class="fab fa-facebook-f"></i></a>
<a href="#"><i class="fab fa-x-twitter"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-tiktok"></i></a>
</div>
<a href="menu.html" class="cta">View Menu</a>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>
</div>

<!-- Main Hero -->
<div class="event-section hero" style="background-image: url('bar.jpg');">
<div class="event-content">
<h1>Live Music, Trivia, & Cold Pints</h1>
<p class="subheading">Greenville, NC</p>
</div>
</div>

<!-- Trivia Night -->
<div class="event-section" style="background-image: url('trivia.jpg');">
<div class="event-content">
<h2>Trivia Night</h2>
<p>Tuesdays • 7 PM</p>
</div>
</div>

<!-- Karaoke -->
<div class="event-section" style="background-image: url('karaoke.jpeg');">
<div class="event-content">
<h2>Karaoke</h2>
<p>Thursdays • 8 PM</p>
</div>
</div>

<!-- Live Music -->
<div class="event-section" style="background-image: url('music.jpg');">
<div class="event-content">
<h2>Live Music</h2>
<p>Fri & Sat • 9 PM</p>
</div>
</div>

<!-- Latest Updates -->
<section style="padding: 80px 20px; background: #f5f5f5;">
<div class="latest-updates">
<h2>Latest Updates</h2>
<div class="fb-card">
<div id="fb-root"></div>
<script async defer crossorigin="anonymous"
src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v19.0">
</script>
<div class="fb-page"
data-href="https://www.facebook.com/ajmcmurphys/"
data-tabs="timeline"
data-width="500"
data-height="600"
data-adapt-container-width="true">
</div>
</div>
</div>
</section>

<!-- Visit Us -->
<section style="padding: 80px 20px; background: #f5f5f5;">
<div style="max-width: 1000px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.08); padding: 40px;">
<h2>Visit Us</h2>
<p style="font-size: 1.1rem; line-height: 1.6;">
<strong>1914 Turnbury Dr</strong><br>
Greenville, NC<br>
(252) 355-7956
</p>
<iframe
width="100%"
height="320"
style="border:0; border-radius: 12px; margin-top: 15px;"
loading="lazy"
src="https://www.google.com/maps?q=1914+Turnbury+Dr+Greenville+NC&output=embed">
</iframe>
</div>
</section>

<footer>
© 2026 AJ McMurphy's Irish Pub
</footer>

<script>
function toggleMenu() {
document.getElementById("menu").classList.toggle("open");
document.getElementById("overlay").classList.toggle("show");
}
window.addEventListener("scroll", function() {
const header = document.querySelector(".header");
if (window.scrollY > 50) {
header.classList.add("scrolled");
} else {
header.classList.remove("scrolled");
}
});
</script>
</body>
</html>
