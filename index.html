<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJ McMurphy's Irish Pub</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: #f5f5f5;
    color: #111;
}

/* HEADER - SOLID PREMIUM */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 40px;
    background: #ffffff;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: all 0.35s ease;
}

/* Shrink on scroll */
.header.scrolled {
    padding: 10px 40px;
    background: #ffffff;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* Subtle divider */
.header::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 40px;
    right: 40px;
    height: 1px;
    background: rgba(0,0,0,0.06);
}

/* LOGO */
.logo {
    height: 90px;
    width: auto;
    transition: all 0.35s ease;
}

.header.scrolled .logo {
    height: 55px;
}

/* RIGHT SIDE */
.header-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

/* SOCIALS */
.socials a {
    color: #444;
    margin: 0 6px;
    font-size: 16px;
    transition: 0.2s;
}

.socials a:hover {
    color: #2e7d32;
    transform: translateY(-2px);
}

/* CTA */
.cta {
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    padding: 12px 22px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 14px rgba(46,125,50,0.3);
    transition: all 0.25s ease;
}

.cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(46,125,50,0.4);
}

/* MENU */
.menu-btn {
    font-size: 24px;
    cursor: pointer;
    padding: 6px;
    transition: 0.2s;
}

.menu-btn:hover {
    transform: scale(1.1);
}

.sidemenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100%;
    background: #111;
    color: white;
    padding: 30px 20px;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1001;
}

.sidemenu.open { transform: translateX(0); }

.sidemenu a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 20px 0;
    font-size: 18px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 1000;
}

.overlay.show {
    opacity: 1;
    pointer-events: all;
}

/* HERO */
.hero {
    min-height: calc(100vh - 80px);
    background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.65)),
    url('bar.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 40px;
    color: white;
    animation: fadeIn 1s ease-in;
}

.hero h1 {
    font-size: clamp(2rem, 4vw, 3rem);
    margin: 0;
    max-width: 700px;
}

/* WAVE */
.wave svg { display: block; width: 100%; margin-top: -5px; }

/* SECTIONS */
section {
    padding: 60px 20px;
    max-width: 1000px;
    margin: auto;
}

h2 { margin-bottom: 20px; }

/* CARDS */
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.fb-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    max-width: 500px;
    margin: auto;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    background: #111;
    color: white;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

</style>
</head>

<body>

<div class="sidemenu" id="menu">
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Events</a>
    <a href="#">Hours</a>
    <a href="#">Contact</a>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="header">
    <img src="logovv.jpg" class="logo">

    <div class="header-right">
        <div class="socials">
            <a href="https://www.facebook.com/ajmcmurphys/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-x-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
        </div>

        <a href="#" class="cta">View Menu</a>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <h1>Live Music, Trivia, & Cold Pints</h1>
</div>

<div class="wave">
<svg viewBox="0 0 1440 120">
<path fill="#f5f5f5" d="M0,64L80,74.7C160,85,320,107,480,101.3C640,96,800,64,960,53.3C1120,43,1280,53,1360,58.7L1440,64V120H0Z"></path>
</svg>
</div>

<section>
<h2>Weekly Events</h2>

<div class="grid">
<div class="card"><strong>Trivia Night</strong><br>Tuesdays • 7 PM</div>
<div class="card"><strong>Karaoke</strong><br>Thursdays • 8 PM</div>
<div class="card"><strong>Live Music</strong><br>Fri & Sat • 9 PM</div>
</div>

</section>

<section>
<h2>Latest Update</h2>

<div class="fb-card">
<div id="fb-root"></div>

<script async defer crossorigin="anonymous"
src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v19.0">
</script>

<div class="fb-page"
     data-href="https://www.facebook.com/ajmcmurphys/"
     data-tabs="timeline"
     data-width="500"
     data-height="600"
     data-small-header="false"
     data-adapt-container-width="true"
     data-hide-cover="false"
     data-show-facepile="true">
</div>

</div>
</section>

<section>
<h2>Visit Us</h2>

<p>
1914 Turnbury Dr<br>
Greenville, NC<br>
(252) 355-7956
</p>

<iframe
width="100%"
height="300"
style="border:0"
loading="lazy"
src="https://www.google.com/maps?q=1914+Turnbury+Dr+Greenville+NC&output=embed">
</iframe>

</section>

<footer>
© 2026 AJ McMurphy's Irish Pub • Est. 1995
</footer>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("show");
}

window.addEventListener("scroll", function() {
    const header = document.querySelector(".header");

    if (window.scrollY > 50) {
        header.classList.add("scrolled");
    } else {
        header.classList.remove("scrolled");
    }
});
</script>

</body>
</html>
